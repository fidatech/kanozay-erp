name: Laravel tests

on:
  push:
    branches:
      - development/kanozay-completion
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pwd
          MYSQL_DATABASE: kanozay_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_root_pwd"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, intl, gd, zip
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Verify compiled PHP and Blade syntax
        run: |
          php artisan view:cache
          FAILED=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/tmp/kanozay-php-lint.txt 2>&1; then
              echo "::error file=$file::Compiled Blade contains invalid PHP"
              cat /tmp/kanozay-php-lint.txt
              nl -ba "$file" | sed -n '1,190p'
              FAILED=1
            fi
          done < <(find storage/framework/views -type f -name '*.php' -print0)
          if [ "$FAILED" -ne 0 ]; then exit 1; fi
          php artisan view:clear
      - name: Verify supplier invoice accounting regression first
        run: php artisan test tests/Feature/MatchedSupplierInvoiceTest.php --stop-on-failure
      - name: Run Laravel test suite
        run: timeout --signal=TERM 900 php artisan test
      - name: Show raw PHPUnit output when the suite fails
        if: failure()
        run: |
          # artisan test hides PHP fatal errors (memory, recursion); raw PHPUnit prints them.
          timeout --signal=TERM 600 php -d display_errors=1 -d log_errors=1 -d error_log=/dev/stderr \
            vendor/bin/phpunit --no-progress 2>&1 | tail -n 250 || true
      - name: Verify clean SQLite installation
        run: |
          touch database/database.sqlite
          export DB_CONNECTION=sqlite
          export DB_DATABASE="$PWD/database/database.sqlite"
          php artisan migrate --force
          php artisan db:seed --force
          php artisan db:seed --class=ChartOfAccountsSeeder --force
          php artisan route:list > /dev/null

      - name: Verify clean MySQL installation
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: kanozay_ci
          DB_USERNAME: root
          DB_PASSWORD: ci_root_pwd
          DB_URL: ""
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --force
          php artisan db:seed --class=ChartOfAccountsSeeder --force
          php artisan route:list > /dev/null

      - name: Run Laravel test suite on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: kanozay_ci
          DB_USERNAME: root
          DB_PASSWORD: ci_root_pwd
          DB_URL: ""
        run: |
          # phpunit.xml only supplies SQLite defaults; real environment variables win,
          # so this run exercises posting, FIFO and reconciliation logic on MySQL 8.
          php artisan config:clear
          timeout --signal=TERM 1500 php artisan test

      - name: Package tested Kanozay ERP application
        if: github.event_name == 'push'
        run: |
          test -f public/build/manifest.json
          test -f vendor/autoload.php
          zip -q -r "/tmp/kanozay-erp-tested-source.zip" . \
            -x '.git/*' './.git/*' '.env' './.env' \
               'node_modules/*' './node_modules/*' \
               'database/*.sqlite' './database/*.sqlite' \
               'storage/logs/*' './storage/logs/*' \
               'storage/framework/cache/*' './storage/framework/cache/*' \
               'storage/framework/sessions/*' './storage/framework/sessions/*' \
               'storage/framework/views/*' './storage/framework/views/*' \
               'storage/app/private/*' './storage/app/private/*' \
               'storage/app/public/*' './storage/app/public/*' \
               'public/vendor/fontawesome/webfonts/*' './public/vendor/fontawesome/webfonts/*' \
               '*.ttf' '*.woff' '*.woff2' '*.otf'
          unzip -tq "/tmp/kanozay-erp-tested-source.zip" | tail -n 1

      - name: Upload tested ERP ZIP
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: kanozay-erp-tested-zip
          path: /tmp/kanozay-erp-tested-source.zip
          if-no-files-found: error
          retention-days: 30
